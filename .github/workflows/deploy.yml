name: DOT-BOX CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  check-backend:
    name: Python Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps + ruff
        run: |
          pip install -r backend/requirements.txt
          pip install ruff

      # Ruff scans ALL .py files → syntax errors, bad imports, unused vars, etc.
      - name: Check all Python files (Ruff)
        run: ruff check backend/ --config backend/ruff.toml

      - name: Check backend imports
        run: |
          cd backend
          python -c "import main; print('Backend OK')"

  check-frontend:
    name: React Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm install
        working-directory: frontend

      - name: Lint all JSX/JS files
        run: npm run lint
        working-directory: frontend

      - name: Build (catches all compile errors)
        run: npm run build
        working-directory: frontend

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [check-backend, check-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deployed!"
